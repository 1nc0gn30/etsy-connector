[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-connector"
version = "0.1.0"
description = "Etsy Open API v3 and Print-on-Demand MCP Connector for Antigravity AI Agents"
authors = [{ name = "Neal Frazier", email = "neal@nealfrazier.tech" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
etsy-connector = "etsy_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
