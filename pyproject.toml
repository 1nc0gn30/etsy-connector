[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etsy-connector"
version = "2.6.0"
description = "Etsy Open API v3, 13-Tag SEO Auditor, 0%/12%/15% Fee Engine, and Printify/Gelato POD MCP Connector"
authors = [{ name = "Neal Frazier Tech (@1nc0gn30)", email = "hello@nullai.tech" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://zoth.nullai.tech/tools/etsy-connector"
Repository = "https://github.com/1nc0gn30/etsy-connector"
Documentation = "https://nullai.tech"

[project.scripts]
etsy-connector = "etsy_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
